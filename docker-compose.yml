services:
  postgres:
    image: postgres:16
    container_name: skillgap-postgres
    environment:
      POSTGRES_USER: skillgap
      POSTGRES_PASSWORD: skillgap_pass
      POSTGRES_DB: skillgap_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: skillgap-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data:
